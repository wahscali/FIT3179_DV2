<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Melbourne public transport recovery</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <h1>Melbourne's network recovered its riders, not its rhythm</h1>
  <h2> Monthly mode</h2>
  <div id="monthly_mode"></div>
  <h2> Station map</h2>
  <div id="station_map"></div>
  <h2> Time band slope</h2>
  <div id="time_band_slope"></div>
  <h2> Distance and time heatmap</h2>
  <div id="distance_time_heatmap"></div>
  <h2> Public transport Share</h2>
  <div id="sa3_pt_share"></div>
  <h2> line change map</h2>
  <div id="line_change_map"></div>
  <script>
    vegaEmbed('#monthly_mode', 'js/monthly_mode.vg.json', {actions: false})
      .catch(console.error);
    vegaEmbed('#station_map', 'js/station_map.vg.json', {actions: false})
      .catch(console.error);
    vegaEmbed('#time_band_slope', 'js/time_band_slope.vg.json', {actions: false})
      .catch(console.error);
    vegaEmbed('#distance_time_heatmap', 'js/distance_time_heatmap.vg.json', {actions: false})
      .catch(console.error);
    vegaEmbed('#sa3_pt_share', 'js/sa3_pt_share.vg.json', {actions: false})
      .catch(console.error);
    vegaEmbed('#line_change_map', 'js/line_change_map.vg.json', {actions: false})
      .catch(console.error);
  </script>
</body>
</html>
