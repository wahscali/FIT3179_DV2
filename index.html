<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Melbourne public transport recovery</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <h1>Melbourne's network recovered its riders, not its rhythm</h1>

  <div id="monthly_mode"></div>

  <div id="station_map"></div>

  <script>
    vegaEmbed('#monthly_mode', 'js/monthly_mode.vg.json', {actions: false})
      .catch(console.error);
    vegaEmbed('#station_map', 'js/station_map.vg.json', {actions: false})
      .catch(console.error);
  </script>
</body>
</html>
